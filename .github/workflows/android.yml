# Marrowmark — Android APK playtest build.
#
# Every push to main (and to the android-apk-pipeline branch) exports the
# "Android" preset from prototype/export_presets.cfg with Godot 4.3 and
# uploads the APK as a workflow artifact. Pushes to main additionally
# attach the APK to the `android-latest` release so it can be downloaded
# directly on a phone:
#   https://github.com/knightdx91-alt/Bloodborn/releases/download/android-latest/marrowmark.apk
#
# The web export (docs/, deployed by GitHub Pages) is untouched by this file.
#
# Verified 2026-09-14 against Godot 4.3.stable: the preset exports a signed,
# installable APK (com.postpeleos.marrowmark, arm64-v8a + armeabi-v7a).
# Two non-obvious requirements discovered during setup, both handled below:
#  1. project.godot must set rendering/textures/vram_compression/import_etc2_astc=true,
#     otherwise the Android export fails with a *blank* configuration error.
#  2. Even for non-Gradle exports, Godot requires the Java SDK path, Android SDK
#     path, and a debug keystore in the Editor Settings (preset keystore fields
#     are left empty so the editor default ~/.local/share/godot/keystores/debug.keystore
#     is used; this job generates it).

name: Android APK

on:
  push:
    branches:
      - main
      - android-apk-pipeline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: $HOME/.local/share/godot/export_templates
          key: godot-export-templates-4.3-stable

      - name: Install Godot 4.3 and export templates
        run: |
          set -eux
          TPL="$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          if [ ! -f "$TPL/android_release.apk" ]; then
            mkdir -p "$TPL" /tmp/tpz
            curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q /tmp/templates.tpz -d /tmp/tpz
            if [ -d /tmp/tpz/templates ]; then mv /tmp/tpz/templates/* "$TPL"/; else mv /tmp/tpz/* "$TPL"/; fi
          fi
          test -f "$TPL/android_release.apk"
          godot --version

      - name: Configure Godot Android export
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -eux
          # The signing key, and why this matters more than it looks.
          #
          # Android refuses to install an APK over one signed by a
          # DIFFERENT key. So if the key changes between builds, every
          # update means uninstall-then-reinstall, which also throws away
          # whatever the app had saved.
          #
          # This used to generate one with `if [ ! -f ... ]` guarding it —
          # which does nothing, because every run starts on a fresh
          # runner with an empty $HOME. keytool therefore fired on EVERY
          # build and produced a new random key each time.
          #
          # Order of preference, first one wins:
          #   1. ANDROID_KEYSTORE_B64 secret — correct, and the only
          #      option that keeps the key out of a public repo.
          #   2. ci/debug.keystore committed in the repo — stable, and
          #      public along with everything else here.
          #   3. Generate one, and say loudly that updates will break.
          KS_DIR="$HOME/.local/share/godot/keystores"
          mkdir -p "$KS_DIR"
          KS="$KS_DIR/debug.keystore"
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
            echo "signing key: from the ANDROID_KEYSTORE_B64 secret"
          elif [ -f "$GITHUB_WORKSPACE/ci/debug.keystore" ]; then
            cp "$GITHUB_WORKSPACE/ci/debug.keystore" "$KS"
            echo "signing key: ci/debug.keystore from the repo"
          else
            echo "::warning::No stable signing key. Generating a throwaway one, so this build CANNOT be installed over the previous one — you will have to uninstall first. Add an ANDROID_KEYSTORE_B64 secret or commit ci/debug.keystore to fix this."
            keytool -genkey -v -keystore "$KS" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$KS" -storepass android | tail -2
          # Editor Settings: Java + Android SDK paths (required even for non-Gradle exports).
          # A fresh editor_settings file has no export/android keys, so append-or-replace.
          godot --headless --editor --quit-after 1 > /dev/null 2>&1 || true
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          set_kv() {
            local key="$1" val="$2"
            if grep -q "^${key} = " "$SETTINGS"; then
              sed -i "s|^${key} = .*|${key} = \"${val}\"|" "$SETTINGS"
            else
              printf '%s = "%s"\n' "$key" "$val" >> "$SETTINGS"
            fi
          }
          set_kv "export/android/java_sdk_path" "$JAVA_HOME"
          set_kv "export/android/android_sdk_path" "$ANDROID_HOME"
          grep -E "^export/android/(java_sdk_path|android_sdk_path)" "$SETTINGS"

      - name: Export APK
        run: |
          set -eux
          mkdir -p dist
          # Version code climbs with the run number, so Android can tell
          # one build from the next and the phone's app info shows which
          # one is installed. Android allows a same-version reinstall but
          # refuses a DOWNGRADE, so this must never go backwards.
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" prototype/export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"0.1.${GITHUB_RUN_NUMBER}\"|" prototype/export_presets.cfg
          grep -E "^version/(code|name)" prototype/export_presets.cfg
          godot --headless --path prototype --export-debug "Android" "$GITHUB_WORKSPACE/dist/marrowmark.apk"
          ls -la dist/

      - name: Verify APK signature
        run: |
          set -eux
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose dist/marrowmark.apk
          # Print the signer certificate digest. Two builds that install
          # over each other have the SAME digest here — it is the one
          # line that tells you whether updating will work, so it goes in
          # every build log rather than being worked out after the fact.
          "$BT/apksigner" verify --print-certs dist/marrowmark.apk | grep -i "SHA-256 digest" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marrowmark-android-apk
          path: dist/marrowmark.apk
          if-no-files-found: error

      - name: Attach APK to playtest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release view android-latest > /dev/null 2>&1 || \
            gh release create android-latest \
              --title "Marrowmark — Android playtest build" \
              --notes "Latest Android APK, built automatically from main. Download on your phone and sideload to playtest."
          gh release upload android-latest dist/marrowmark.apk --clobber
